# ausz — OpenID Connect Provider Configuration
#
# This file configures the OIDC provider. Environment variables override
# these values. See docs/ROADMAP.md for the delivery plan.

# ---------------------------------------------------------------------------
# Required: the issuer URL
# ---------------------------------------------------------------------------
# This is the base URL of this provider. All endpoint URLs are derived from it.
# Must be https:// in production.
issuer = "http://localhost:3000"

# ---------------------------------------------------------------------------
# Feature flags: which OIDC features are enabled
# ---------------------------------------------------------------------------
[feature_flags]
response_types_supported = [
    "code",
    "code id_token",
    "id_token token",
    "code token",
]
grant_types_supported = [
    "authorization_code",
    "refresh_token",
    "client_credentials",
    "urn:ietf:params:oauth:grant-type:device_code",
]
subject_types_supported = [
    "public",
]
id_token_signing_alg_values_supported = [
    "RS256",
    "ES256",
]
scopes_supported = [
    "openid",
    "profile",
    "email",
    "email_verified",
    "name",
    "preferred_username",
    "nickname",
    "address",
    "phone",
    "offline_access",
]
code_challenge_methods_supported = [
    "S256",
]

# ---------------------------------------------------------------------------
# Token lifetimes (in seconds)
# ---------------------------------------------------------------------------
[token_lifetimes]
access_token_ttl = 3600          # 1 hour
refresh_token_ttl = 2592000      # 30 days
authorization_code_ttl = 600     # 10 minutes
device_code_ttl = 300            # 5 minutes
device_poll_interval = 5         # 5 seconds

# ---------------------------------------------------------------------------
# JWKS / signing configuration
# ---------------------------------------------------------------------------
[jwks]
# Path to a PEM key pair file. If empty, keys are auto-generated in memory.
# In production, set this to a real key file path.
key_pair_file = ""

# Key identifier (kid) used in JWT headers.
key_id = "ausz-dev-001"

# Signing algorithm (RS256 or ES256).
key_algorithm = "RS256"

# Auto-generate new keys on a schedule.
auto_rotate = false
